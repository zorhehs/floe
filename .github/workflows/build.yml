name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: "Run the full-stack integration test"
        type: boolean
        default: true

env:
  PYTHON_VERSION: "3.10"

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            config/docker/requirements-tools.txt
            config/docker/constraints-airflow-2.10.5-py3.10.txt
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Install dependencies (same pins as the images)
        run: pip install ruff -r tests/requirements.txt
      - name: Lint (ruff)
        run: ruff check src tests docs/report/latex
      - name: Compile all Python
        run: python -m compileall -q src tests docs/report/latex
      - name: Shell syntax
        run: |
          for f in scripts/*.sh scripts/demos/*.sh tests/integration/*.sh config/postgres/init/*.sh config/docker/*.sh; do bash -n "$f"; done
          sh -n config/debezium/register.sh
      - name: Unit tests
        run: pytest -q tests/unit
      - name: Validate docker-compose.yml
        run: cp .env.example .env && docker compose --profile tools --profile workload config -q

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Cache the pinned Spark jars
        uses: actions/cache@v4
        with:
          path: |
            config/docker/jars
            config/docker/catalog-jars
          key: jars-${{ hashFiles('scripts/fetch-jars.sh') }}
      - run: ./scripts/fetch-jars.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build spark / tools / airflow images (layer cache in GitHub Actions)
        uses: docker/bake-action@v5
        with:
          files: docker-compose.yml
          targets: spark-streaming,tools,airflow
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - name: Smoke test the tools image
        run: docker compose --profile tools run --rm --no-deps tools python3 -c "import consumers.bench, console.app, producer.generator; print('tools image ok')"

  integration:
    # The full stack needs ~11 GB of memory caps (steady state ~6 GB) and ~15 minutes, so it
    # runs on pushes to main, on release tags and on request, not on every pull request.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.integration)
    runs-on: ubuntu-latest
    needs: build-images
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && echo "TPCH_SCALE=tiny" >> .env && chmod -R a+rwX results
      - name: Cache the pinned Spark jars
        uses: actions/cache@v4
        with:
          path: |
            config/docker/jars
            config/docker/catalog-jars
          key: jars-${{ hashFiles('scripts/fetch-jars.sh') }}
      - run: ./scripts/fetch-jars.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build images from the shared layer cache
        uses: docker/bake-action@v5
        with:
          files: docker-compose.yml
          targets: spark-streaming,tools,airflow
          load: true
          set: |
            *.cache-from=type=gha
      - name: Full pipeline integration test
        run: ./tests/integration/test_pipeline.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
