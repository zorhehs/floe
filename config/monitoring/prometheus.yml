global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: lakehouse-exporter        # CDC freshness, slot lag, Iceberg files, ingest rate
    static_configs: [{targets: ["exporter:9108"]}]

  - job_name: spark-streaming           # Spark driver + Structured Streaming metrics
    metrics_path: /metrics/prometheus
    static_configs: [{targets: ["spark-streaming:4040"]}]

  - job_name: minio                     # object store capacity / requests
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{targets: ["minio:9000"]}]

  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
