# Single-node Trino: coordinator also executes queries.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Memory sized for the 1 GB heap set in jvm.config (container limit 1.5 GB).
query.max-memory=600MB
query.max-memory-per-node=600MB
memory.heap-headroom-per-node=200MB

# Large joins/aggregations spill to local disk instead of failing.
spill-enabled=true
spiller-spill-path=/tmp/trino-spill
