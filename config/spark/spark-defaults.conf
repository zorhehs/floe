# Iceberg catalog "lakehouse" backed by the Iceberg REST catalog + MinIO (S3).
spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakehouse                  org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type             rest
spark.sql.catalog.lakehouse.uri              http://iceberg-rest:8181
spark.sql.catalog.lakehouse.warehouse        s3://warehouse/
spark.sql.catalog.lakehouse.io-impl          org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint      http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access true
spark.sql.defaultCatalog                     lakehouse

# Debezium timestamps are UTC epoch based; keep Spark in UTC so they round-trip.
spark.sql.session.timeZone                   UTC
spark.sql.shuffle.partitions                 8
spark.sql.adaptive.enabled                   true
spark.ui.showConsoleProgress                 false
spark.driver.extraJavaOptions                -Daws.region=us-east-1

# Monitoring: Prometheus endpoint on the driver UI port + streaming query metrics
spark.metrics.conf                           /opt/spark/conf/metrics.properties
spark.metrics.namespace                      lakehouse
spark.sql.streaming.metricsEnabled           true
spark.ui.prometheus.enabled                  true
