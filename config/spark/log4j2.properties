rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = warn
logger.kafka.name = org.apache.kafka
logger.kafka.level = warn
# Iceberg's leak detector reports S3FileIO instances of short-lived table
# refreshes; harmless noise for a long-running streaming job.
logger.s3fileio.name = org.apache.iceberg.aws.s3.S3FileIO
logger.s3fileio.level = error
# Expected: AQE is disabled for streaming queries.
logger.writetostream.name = org.apache.spark.sql.execution.streaming.ResolveWriteToStream
logger.writetostream.level = error
