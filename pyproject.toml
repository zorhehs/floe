[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff.lint.per-file-ignores]
# runs on the host's system Python (3.9 on macOS), where zip(strict=...) does not exist
"docs/report/build_report.py" = ["B905"]
